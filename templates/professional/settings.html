<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Professional Settings</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Settings</h1>
        <div>
            <a href="/professional/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Back to Agenda</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </div>
    </nav>
    <main class="p-4 max-w-md mx-auto">
        <div class="bg-white p-4 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Edit Profile</h2>
            <form id="profileForm">
                <div class="mb-2">
                    <label class="block">Name</label>
                    <input type="text" id="name" required class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label class="block">Email</label>
                    <input type="email" id="email" required class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label class="block">Phone</label>
                    <input type="text" id="phone" class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label class="block">Buffer (minutes between appointments)</label>
                    <input type="number" id="buffer" min="0" step="5" class="w-full border rounded px-2 py-1">
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Save Changes</button>
            </form>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/professional_settings.js') }}"></script>
</body>
</html>
