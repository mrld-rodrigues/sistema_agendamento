<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin - {{ 'Editar' if profissional_id else 'Novo' }} Profissional</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - {{ 'Editar' if profissional_id else 'Novo' }} Profissional</h1>
        <div>
            <a href="/admin/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Dashboard</a>
            <a href="/admin/professionals" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Voltar</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 ml-2">Logout</button>
        </div>
    </nav>

    <main class="p-4 max-w-md mx-auto">
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-2xl font-bold mb-4" id="form-title">
                {% if profissional_id %}Editar Profissional{% else %}Novo Profissional{% endif %}
            </h2>
            <form id="profissional-form">
                <input type="hidden" id="profissional-id" value="{{ profissional_id or '' }}">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nome *</label>
                    <input type="text" id="nome" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Especialidade *</label>
                    <input type="text" id="especialidade" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Telefone</label>
                    <input type="text" id="telefone" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Intervalo entre atendimentos (min)</label>
                    <input type="number" id="intervalo" min="0" step="5" value="15" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Ativo</label>
                    <select id="ativo" class="w-full border rounded px-3 py-2">
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                {% if not profissional_id %}
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Senha *</label>
                    <input type="password" id="senha" required class="w-full border rounded px-3 py-2">
                </div>
                {% endif %}
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                    {{ 'Salvar' if profissional_id else 'Criar' }}
                </button>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/professional_form.js') }}"></script>
</body>
</html>
