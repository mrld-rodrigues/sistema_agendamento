<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin - Agendamentos</title>
</head>
<body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - Agendamentos</h1>
        <div>
            <a href="/admin/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Dashboard</a>
            <a href="/admin/clients" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Clientes</a>
            <a href="/admin/professionals" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Profissionais</a>
            <a href="/admin/services" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Serviços</a>
            <a href="/admin/blocks" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Bloqueios</a>
            <a href="/admin/appointments" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Agendamentos</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="p-4">
        <h2 class="text-2xl font-bold mb-4">Lista de Agendamentos</h2>

        <!-- Filtros -->
        <div class="bg-white p-4 rounded shadow mb-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2">Profissional</label>
                    <select id="filtroProfissional" class="w-full border rounded px-3 py-2">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Data</label>
                    <input type="date" id="filtroData" class="w-full border rounded px-3 py-2">
                </div>
                <div class="flex items-end">
                    <button id="btnFiltrar" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Filtrar</button>
                    <button id="btnLimpar" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 ml-2">Limpar</button>
                </div>
            </div>
        </div>

        <!-- Tabela de agendamentos -->
        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="px-4 py-2 text-left">ID</th>
                        <th class="px-4 py-2 text-left">Cliente</th>
                        <th class="px-4 py-2 text-left">Profissional</th>
                        <th class="px-4 py-2 text-left">Serviço</th>
                        <th class="px-4 py-2 text-left">Data/Hora</th>
                        <th class="px-4 py-2 text-left">Duração</th>
                        <th class="px-4 py-2 text-left">Ações</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTableBody">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal de remarcação (simples) -->
    <div id="rescheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white p-6 rounded shadow-lg w-96">
            <h3 class="text-xl font-bold mb-4">Remarcar Agendamento</h3>
            <input type="hidden" id="rescheduleId">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Nova data/hora</label>
                <input type="datetime-local" id="rescheduleDateTime" class="w-full border rounded px-3 py-2">
            </div>
            <div class="flex justify-end">
                <button id="btnCancelarModal" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Cancelar</button>
                <button id="btnConfirmarRemarcacao" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/appointments.js') }}"></script>
</body>
</html>
