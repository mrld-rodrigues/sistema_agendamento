<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin - {{ 'Editar' if servico_id else 'Novo' }} Serviço</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - {{ 'Editar' if servico_id else 'Novo' }} Serviço</h1>
        <div>
            <a href="/admin/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Dashboard</a>
            <a href="/admin/services" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Voltar</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 ml-2">Logout</button>
        </div>
    </nav>

    <main class="p-4 max-w-md mx-auto">
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-2xl font-bold mb-4" id="form-title">
                {% if servico_id %}Editar Serviço{% else %}Novo Serviço{% endif %}
            </h2>
            <form id="serviceForm">
                <input type="hidden" id="serviceId" value="{{ servico_id or '' }}">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nome *</label>
                    <input type="text" id="nome" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Descrição</label>
                    <textarea id="descricao" rows="3" class="w-full border rounded px-3 py-2"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Duração (minutos) *</label>
                    <input type="number" id="duracao" min="1" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Preço (€) *</label>
                    <input type="number" id="preco" min="0" step="0.01" required class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Ativo</label>
                    <select id="ativo" class="w-full border rounded px-3 py-2">
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                    {{ 'Salvar' if servico_id else 'Criar' }}
                </button>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/service_form.js') }}"></script>
</body>
</html>
