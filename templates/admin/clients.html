<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin - Clientes</title>
</head>
<body class="bg-gray-100">
    <!-- Navbar (reutilizável) -->
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - Clientes</h1>
        <div>
            <a href="/admin/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Dashboard</a>
            <a href="/admin/clients" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Clientes</a>
            <a href="/admin/professionals" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Profissionais</a>
            <a href="/admin/services" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Serviços</a>
            <a href="/admin/appointments" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mr-2">Agendamentos</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </div>
    </nav>

    <main class="p-4">
        <h2 class="text-2xl font-bold mb-4">Lista de Clientes</h2>
        <button id="novoClienteBtn" class="bg-green-500 text-white px-4 py-2 rounded mb-4 hover:bg-green-600">Novo Cliente</button>
        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/clientes.js') }}"></script>
</body>
</html>
