<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin - Client Form</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Admin Panel - Client Form</h1>
        <div class="space-x-2">
            <a href="/admin/dashboard" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Dashboard</a>
            <a href="/admin/clients" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Back to Clients</a>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </div>
    </nav>

    <main class="p-4 max-w-lg mx-auto">
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-2xl font-bold mb-4" id="form-title">New Client</h2>
            <form id="clientForm">
                <!-- Campo oculto para armazenar o ID do cliente (quando editando) -->
                <input type="hidden" id="clientId" value="">

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Name *</label>
                    <input type="text" id="nome" required class="w-full border rounded px-3 py-2">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" class="w-full border rounded px-3 py-2">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Phone</label>
                    <input type="text" id="telefone" class="w-full border rounded px-3 py-2">
                </div>

                <div class="flex justify-end space-x-2">
                    <a href="/admin/clients" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</a>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save</button>
                </div>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/client_form.js') }}"></script>
</body>
</html>
