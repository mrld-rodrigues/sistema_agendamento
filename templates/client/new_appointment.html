<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>New Appointment</title>
</head>
<body class="bg-gray-100 p-4">
    <nav class="bg-white shadow p-4 flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold">New Appointment</h1>
        <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
    </nav>
    <form id="appointmentForm" class="bg-white p-4 rounded shadow max-w-md mx-auto">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Professional</label>
            <select id="professional_id" required class="w-full px-3 py-2 border rounded">
                <option value="">Loading...</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Service</label>
            <select id="service_id" required class="w-full px-3 py-2 border rounded">
                <option value="">Loading...</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Date</label>
            <input type="date" id="date" required class="w-full px-3 py-2 border rounded">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Time</label>
            <input type="time" id="time" required class="w-full px-3 py-2 border rounded">
        </div>
        <div id="availableSlots" class="mb-4 p-2 bg-gray-50 rounded hidden"></div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Schedule</button>
    </form>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        checkAuth();

        let servicesDuration = {};
        let servicesLoaded = false;

        async function loadProfessionals() {
            try {
                const professionals = await apiFetch('/profissionais');
                const select = document.getElementById('professional_id');
                select.innerHTML = '<option value="">Select a professional...</option>';
                professionals.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.nome} (${p.especialidade})</option>`;
                });
            } catch (err) {
                console.error('Error loading professionals:', err);
                alert('Could not load professionals.');
            }
        }

        async function loadServices() {
            try {
                const services = await apiFetch('/servicos');
                const select = document.getElementById('service_id');
                select.innerHTML = '<option value="">Select a service...</option>';
                services.forEach(s => {
                    servicesDuration[String(s.id)] = s.duracao_minutos;
                    select.innerHTML += `<option value="${s.id}">${s.nome} (${s.duracao_minutos} min)</option>`;
                });
                servicesLoaded = true;
                console.log('Services loaded:', servicesDuration);
            } catch (err) {
                console.error('Error loading services:', err);
                alert('Could not load services.');
            }
        }

        document.getElementById('professional_id').addEventListener('change', fetchAvailableSlots);
        document.getElementById('service_id').addEventListener('change', fetchAvailableSlots);
        document.getElementById('date').addEventListener('change', fetchAvailableSlots);

        async function fetchAvailableSlots() {
            const professional_id = document.getElementById('professional_id').value;
            const service_id = document.getElementById('service_id').value;
            const date = document.getElementById('date').value;

            if (!professional_id || !service_id || !date) {
                document.getElementById('availableSlots').classList.add('hidden');
                return;
            }

            if (!servicesLoaded) {
                console.log('Waiting for services to load...');
                setTimeout(fetchAvailableSlots, 100);
                return;
            }

            const duration = servicesDuration[String(service_id)];
            console.log('Service ID:', service_id, 'Duration:', duration);

            if (!duration) {
                console.error('Duration not found for service', service_id);
                return;
            }

            const url = `/agendamentos/horarios-livres?profissional_id=${professional_id}&servico_id=${service_id}&data=${date}`;
            console.log('Fetching URL:', url);

            try {
                const intervals = await apiFetch(url);
                console.log('Received intervals:', intervals);

                const div = document.getElementById('availableSlots');
                if (!intervals || intervals.length === 0) {
                    div.innerHTML = '<p class="text-red-500">No available slots on this date.</p>';
                    div.classList.remove('hidden');
                } else {
                    let html = '<p class="font-bold">Available times:</p><div class="flex flex-wrap gap-2 mt-2">';
                    
                    intervals.forEach(interval => {
                        // Converte strings "HH:MM" para objetos Date com uma data base
                        // Usamos uma data fixa para comparação, mas precisamos tratar o caso em que o fim é meia-noite (00:00) do dia seguinte.
                        let start = new Date(`1970-01-01T${interval.inicio}:00`);
                        let end = new Date(`1970-01-01T${interval.fim}:00`);
                        
                        // Se o fim for meia-noite ou anterior ao início, significa que o intervalo cruza para o dia seguinte
                        // Ex: inicio=18:00, fim=00:00 -> fim é na verdade 24:00 do mesmo dia, então devemos adicionar 1 dia ao fim.
                        if (end <= start) {
                            end = new Date(end.getTime() + 24 * 60 * 60 * 1000); // adiciona 1 dia
                        }
                        
                        let current = new Date(start);
                        
                        console.log('Processing interval:', interval.inicio, '-', interval.fim, 'adjusted end:', end);

                        // Gera horários a cada 'duration' minutos dentro do intervalo
                        while (current.getTime() + duration * 60000 <= end.getTime()) {
                            let timeStr = current.toTimeString().substring(0, 5);
                            html += `<button type="button" class="bg-green-100 px-3 py-1 rounded hover:bg-green-200" onclick="selectTime('${timeStr}')">${timeStr}</button>`;
                            // Avança pela duração do serviço
                            current = new Date(current.getTime() + duration * 60000);
                        }
                    });
                    
                    html += '</div>';
                    div.innerHTML = html;
                    div.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Error fetching slots:', err);
                alert('Error fetching available slots: ' + err.message);
            }
        }

        window.selectTime = function(time) {
            document.getElementById('time').value = time;
        };

        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = await apiFetch('/auth/me');
            const payload = {
                cliente_id: userData.cliente_id,
                profissional_id: document.getElementById('professional_id').value,
                servico_id: document.getElementById('service_id').value,
                data_hora: `${document.getElementById('date').value} ${document.getElementById('time').value}:00`
            };
            console.log('Creating appointment:', payload);
            try {
                const result = await apiFetch('/agendamentos', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert('Appointment created successfully!');
                window.location.href = '/client/dashboard';
            } catch (err) {
                alert(err.message);
            }
        });

        loadProfessionals();
        loadServices();
    </script>
</body>
</html>
