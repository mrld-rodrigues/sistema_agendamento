<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Novo Agendamento</title>
</head>
<body class="bg-gray-100 p-4">
    <nav class="bg-white shadow p-4 flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold">Novo Agendamento</h1>
        <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Sair</button>
    </nav>
    <form id="agendamentoForm" class="bg-white p-4 rounded shadow max-w-md mx-auto">
        <!-- Seleção de profissional -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Profissional</label>
            <select id="profissional_id" required class="w-full px-3 py-2 border rounded">
                <option value="">Carregando...</option>
            </select>
        </div>
        <!-- Seleção de serviço -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Serviço</label>
            <select id="servico_id" required class="w-full px-3 py-2 border rounded">
                <option value="">Carregando...</option>
            </select>
        </div>
        <!-- Data do agendamento -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Data</label>
            <input type="date" id="data" required class="w-full px-3 py-2 border rounded">
        </div>
        <!-- Hora do agendamento (pode ser preenchida manualmente ou via botões) -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Hora</label>
            <input type="time" id="hora" required class="w-full px-3 py-2 border rounded">
        </div>
        <!-- Área para exibir horários livres (inicialmente oculta) -->
        <div id="horariosLivres" class="mb-4 p-2 bg-gray-50 rounded hidden"></div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Agendar</button>
    </form>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        // Verifica autenticação
        checkAuth();

        /**
         * Carrega a lista de profissionais do backend e preenche o select.
         */
        async function carregarProfissionais() {
            const profissionais = await apiFetch('/profissionais');
            const select = document.getElementById('profissional_id');
            select.innerHTML = '<option value="">Selecione...</option>';
            profissionais.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.nome} (${p.especialidade})</option>`;
            });
        }

        /**
         * Carrega a lista de serviços do backend e preenche o select.
         */
        async function carregarServicos() {
            const servicos = await apiFetch('/servicos');
            const select = document.getElementById('servico_id');
            select.innerHTML = '<option value="">Selecione...</option>';
            servicos.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.nome} (${s.duracao_minutos} min)</option>`;
            });
        }

        // Adiciona listeners para os campos que, ao serem alterados, disparam a busca de horários
        document.getElementById('profissional_id').addEventListener('change', buscarHorarios);
        document.getElementById('servico_id').addEventListener('change', buscarHorarios);
        document.getElementById('data').addEventListener('change', buscarHorarios);

        /**
         * Busca os horários livres para o profissional, serviço e data selecionados.
         * Exibe os intervalos como botões clicáveis.
         */
        async function buscarHorarios() {
            const profissional_id = document.getElementById('profissional_id').value;
            const servico_id = document.getElementById('servico_id').value;
            const data = document.getElementById('data').value;
            if (!profissional_id || !servico_id || !data) return;

            const url = `/agendamentos/horarios-livres?profissional_id=${profissional_id}&servico_id=${servico_id}&data=${data}`;
            try {
                const intervalos = await apiFetch(url);
                const div = document.getElementById('horariosLivres');
                if (intervalos.length === 0) {
                    div.innerHTML = '<p class="text-red-500">Nenhum horário disponível nesta data.</p>';
                    div.classList.remove('hidden');
                } else {
                    let html = '<p class="font-bold">Horários disponíveis:</p><div class="flex flex-wrap gap-2 mt-2">';
                    intervalos.forEach(i => {
                        // Cria um botão para cada horário de início; ao clicar, preenche o campo hora
                        html += `<button type="button" class="bg-green-100 px-3 py-1 rounded hover:bg-green-200" onclick="selecionarHora('${i.inicio}')">${i.inicio}</button>`;
                    });
                    html += '</div>';
                    div.innerHTML = html;
                    div.classList.remove('hidden');
                }
            } catch (err) {
                alert('Erro ao buscar horários: ' + err.message);
            }
        }

        /**
         * Função global chamada pelos botões de horário para preencher o campo hora.
         * @param {string} hora - Hora no formato "HH:MM"
         */
        window.selecionarHora = function(hora) {
            document.getElementById('hora').value = hora;
        };

        // Submissão do formulário: cria o agendamento
        document.getElementById('agendamentoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Obtém dados do usuário logado para pegar o cliente_id
            const userData = await apiFetch('/auth/me');
            const payload = {
                cliente_id: userData.cliente_id,
                profissional_id: document.getElementById('profissional_id').value,
                servico_id: document.getElementById('servico_id').value,
                data_hora: `${document.getElementById('data').value} ${document.getElementById('hora').value}:00`
            };
            try {
                const result = await apiFetch('/agendamentos', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert('Agendamento criado com sucesso!');
                window.location.href = '/cliente/dashboard';
            } catch (err) {
                alert(err.message);
            }
        });

        // Carrega as listas iniciais
        carregarProfissionais();
        carregarServicos();
    </script>
</body>
</html>
